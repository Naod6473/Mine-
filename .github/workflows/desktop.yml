# Construit l'app de bureau (Windows, macOS, Linux).
# Chaque push sur main produit les installeurs en artefacts ; un tag « desktop-v1.2.3 » les publie
# dans une release GitHub (en brouillon, à relire avant de la rendre publique).
name: Desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'ui/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, args: '' }
          - { os: macos-latest, name: macos, args: '--target universal-apple-darwin' }
          - { os: ubuntu-22.04, name: linux, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Bibliothèques Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: desktop
      - name: Tests Rust
        if: matrix.name == 'linux'
        run: cargo test
        working-directory: desktop/src-tauri
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Mine!? {0}', github.ref_name) || '' }}
          releaseBody: |
            Installeurs de Mine!? pour Windows (.exe), macOS (.dmg) et Linux (.AppImage, .deb).
            Au premier lancement, l'app télécharge yt-dlp, ffmpeg et deno (une seule fois).
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: mine-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
